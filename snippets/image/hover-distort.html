<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGL 悬停置换变形</title>
<!--
  图片悬停置换变形（hover distortion）：双击即可预览。
  鼠标划过图片时产生液态波纹扭曲——CSS filter 做不到的"真变形"。
  原理：把图片作为纹理送进 fragment shader，用噪声按鼠标距离
  扭曲采样坐标（UV 置换），再叠加轻微 RGB 色差。
  图片加载失败会自动换成程序生成的渐变纹理（离线也能预览）。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100%; min-height: 100vh;
    display: grid; place-items: center;
    background: #07070f;
    overflow-x: hidden;
  }
  .distort-frame {
    position: relative;
    width: min(72vw, 860px);
    aspect-ratio: 16 / 10;
  }
  canvas { width: 100%; height: 100%; display: block; border-radius: 14px; }
  .label {
    position: absolute; left: 20px; bottom: 16px;
    color: #fff; font: 600 14px/1 "PingFang SC", sans-serif;
    letter-spacing: 0.1em; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<div class="distort-frame">
  <canvas id="gl"></canvas>
  <div class="label">划过图片试试 · liquid distort</div>
</div>

<script>
  // ===== 视觉参数集中区 =====
  const CONFIG = {
    imageUrl: "https://picsum.photos/1280/800",  // 换成你的图；加载失败自动用渐变兜底
    rippleStrength: 0.035,  // 置换强度（UV 单位）：0.02~0.05，再大画面"碎"
    rippleRadius: 0.45,     // 鼠标影响半径（UV 单位）
    chromatic: 0.004,       // RGB 色差偏移：微微错位才有"玻璃"感
    noiseScale: 6.0,        // 噪声频率：越大波纹越细密
    speed: 1.2,             // 波纹流动速度
    easing: 0.08,           // 鼠标位置缓动：小=涟漪拖尾感
    pixelRatioCap: 2,
  };

  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl", { antialias: false });

  const VERT = `
    attribute vec2 a_position;
    varying vec2 v_uv;
    void main() {
      v_uv = a_position * 0.5 + 0.5;   // clip space(-1~1) 转 uv(0~1)
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const FRAG = `
    precision mediump float;
    varying vec2 v_uv;
    uniform sampler2D u_image;
    uniform vec2 u_mouse;      // 已缓动的鼠标 uv
    uniform float u_time;
    uniform float u_strength;  // reduced-motion 时会被置 0

    // 简易 2D 噪声：sin 组合的伪噪声足够做波纹（省掉完整 Perlin 的代码量）
    float noise(vec2 p) {
      return sin(p.x * 3.1 + u_time) * sin(p.y * 2.7 - u_time * 0.8)
           + sin((p.x + p.y) * 1.9 + u_time * 0.6);
    }

    void main() {
      vec2 uv = v_uv;
      float dist = distance(uv, u_mouse);

      // 只有鼠标附近才扭：强度随距离平滑衰减，其余区域纹丝不动
      float influence = smoothstep(${CONFIG.rippleRadius}, 0.0, dist);

      vec2 displacement = vec2(
        noise(uv * ${CONFIG.noiseScale.toFixed(1)}),
        noise(uv * ${CONFIG.noiseScale.toFixed(1)} + 13.7)
      ) * u_strength * influence;

      uv += displacement;

      // RGB 色差：三通道按位移量微微错开采样 → 玻璃棱镜感
      float shift = ${CONFIG.chromatic.toFixed(3)} * influence;
      float r = texture2D(u_image, uv + displacement * shift).r;
      float g = texture2D(u_image, uv).g;
      float b = texture2D(u_image, uv - displacement * shift).b;
      float a = texture2D(u_image, uv).a;

      gl_FragColor = vec4(r, g, b, a);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, "a_position");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const u = {
    image:  gl.getUniformLocation(program, "u_image"),
    mouse:  gl.getUniformLocation(program, "u_mouse"),
    time:   gl.getUniformLocation(program, "u_time"),
    strength: gl.getUniformLocation(program, "u_strength"),
  };

  // --- 纹理装载：图片优先，失败时程序生成渐变（离线可看） ---
  function makeFallbackTexture() {
    // 256×256 像素逐点填渐变：无网络依赖的兜底，保证 demo 永远能跑
    const size = 256;
    const data = new Uint8Array(size * size * 4);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i = (y * size + x) * 4;
        data[i]     = 40 + (x / size) * 180; // R：左暗右亮
        data[i + 1] = 30 + (y / size) * 120; // G：上暗下亮
        data[i + 2] = 140 + Math.sin((x + y) / size * 12) * 60; // B：波浪
        data[i + 3] = 255;
      }
    }
    return data;
  }

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE,
    (() => { // 先塞渐变，图片到了再覆盖 —— 页面永不空白
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const ctx2d = c.getContext("2d");
      const img2 = ctx2d.createImageData(256, 256);
      img2.data.set(makeFallbackTexture());
      ctx2d.putImageData(img2, 0, 0);
      return c;
    })());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);

  const img = new Image();
  img.crossOrigin = "anonymous"; // 跨域图片必须，否则纹理上传被 taint 拒绝
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  };
  img.src = CONFIG.imageUrl;

  // --- 鼠标：直接更新会"瞬移"，缓动才有"涟漪拖在身后"的感觉 ---
  const mouse = { x: 0.5, y: 0.5 };
  const eased = { x: 0.5, y: 0.5 };

  canvas.parentElement.addEventListener("pointermove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) / rect.width;
    mouse.y = 1 - (e.clientY - rect.top) / rect.height; // 翻转 Y：uv 原点在左下
  });

  function resize() {
    const ratio = Math.min(window.devicePixelRatio || 1, CONFIG.pixelRatioCap);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.floor(rect.width * ratio);
    canvas.height = Math.floor(rect.height * ratio);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  const t0 = performance.now();
  function render(now) {
    const t = ((now - t0) / 1000) * CONFIG.speed;
    eased.x += (mouse.x - eased.x) * CONFIG.easing;
    eased.y += (mouse.y - eased.y) * CONFIG.easing;
    gl.uniform1i(u.image, 0);
    gl.uniform2f(u.mouse, eased.x, eased.y);
    gl.uniform1f(u.time, t);
    // 降级：强度归零 → shader 里 influence 全部乘 0，图片原样显示
    gl.uniform1f(u.strength, prefersReducedMotion ? 0 : CONFIG.rippleStrength);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  if (prefersReducedMotion) {
    render(performance.now()); // 一帧静态原图
  } else {
    (function loop(now) {
      requestAnimationFrame(loop);
      render(now);
    })(performance.now());
  }
</script>
</body>
</html>
